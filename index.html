<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Guru BDP SEMSIRA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#f4f6f9; padding:20px; }
h2 { text-align:center; color:#004080; }
.card { max-width:900px; margin:auto; padding:20px; border-radius:15px; box-shadow:0 6px 18px rgba(0,0,0,.1); margin-bottom:30px; }
table th, table td { text-align:center; }
</style>
</head>

<body>

<h2>📝 Key In Kes Disiplin</h2>
<div class="card">
<form id="disciplineForm">
  <select id="kelas" class="form-select mb-2" required>
    <option value="">Pilih Kelas</option>
    <option>6 SARAH</option>
    <option>6 SUMAYYAH</option>
    <option>6 KHADIJAH</option>
  </select>

  <select id="kategori" class="form-select mb-2" required>
    <option value="">Pilih Kategori</option>
    <option>Ringan</option>
    <option>Sederhana</option>
    <option>Berat</option>
  </select>

  <input id="jenis" class="form-control mb-2" placeholder="Jenis Kesalahan" required>
  <input id="nama" class="form-control mb-2" placeholder="Nama Pelajar" required>

  <button class="btn btn-primary w-100">Hantar</button>
</form>
<p id="msg" class="text-center mt-2 fw-bold"></p>
</div>

<h2>📋 Senarai Kes</h2>
<div class="card">
<table class="table table-bordered">
<thead class="table-dark">
<tr>
<th>Kelas</th><th>Nama</th><th>Kategori</th><th>Jenis</th><th>Tarikh</th><th>Tindakan</th>
</tr>
</thead>
<tbody id="kesTable"></tbody>
</table>
</div>

<h2>📊 Statistik</h2>
<div class="card">
<canvas id="barChart"></canvas>
<canvas id="pieChart" class="mt-4"></canvas>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  doc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDn8SLqrdo4f6IyD1nUSKmKkkHFcjem7uM",
  authDomain: "bdp-semsira.firebaseapp.com",
  projectId: "bdp-semsira",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* === DOM ELEMENTS (DITAMBAH TANPA UBAH FUNGSI) === */
const disciplineForm = document.getElementById("disciplineForm");
const kelas = document.getElementById("kelas");
const kategori = document.getElementById("kategori");
const jenis = document.getElementById("jenis");
const nama = document.getElementById("nama");
const msg = document.getElementById("msg");

/* === FORM SUBMIT === */
disciplineForm.onsubmit = async e => {
  e.preventDefault();
  await addDoc(collection(db,"kesDisiplin"),{
    kelas: kelas.value,
    kategori: kategori.value,
    jenis: jenis.value,
    nama: nama.value,
    tarikh: new Date()
  });
  msg.innerText = "✅ Kes berjaya direkod";
  disciplineForm.reset();
};

/* === CHART === */
let barChart, pieChart;
const barCtx = document.getElementById("barChart");
const pieCtx = document.getElementById("pieChart");

/* === REALTIME DATA === */
onSnapshot(collection(db,"kesDisiplin"), snap=>{
  const tbody = document.getElementById("kesTable");
  tbody.innerHTML = "";

  let kelasData = {};
  let total = {Ringan:0,Sederhana:0,Berat:0};

  snap.forEach(docSnap=>{
    const d = docSnap.data();

    tbody.innerHTML += `
    <tr>
      <td>${d.kelas}</td>
      <td>${d.nama}</td>
      <td>${d.kategori}</td>
      <td>${d.jenis}</td>
      <td>${d.tarikh.toDate().toLocaleDateString()}</td>
      <td>
        <button class="btn btn-sm btn-warning" onclick="editKes('${docSnap.id}','${d.jenis}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteKes('${docSnap.id}')">Delete</button>
      </td>
    </tr>`;

    if(!kelasData[d.kelas]) kelasData[d.kelas]={Ringan:0,Sederhana:0,Berat:0};
    kelasData[d.kelas][d.kategori]++;
    total[d.kategori]++;
  });

  if(barChart) barChart.destroy();
  barChart = new Chart(barCtx,{
    type:"bar",
    data:{
      labels:Object.keys(kelasData),
      datasets:[
        {label:"Ringan", data:Object.values(kelasData).map(d=>d.Ringan)},
        {label:"Sederhana", data:Object.values(kelasData).map(d=>d.Sederhana)},
        {label:"Berat", data:Object.values(kelasData).map(d=>d.Berat)}
      ]
    },
    options:{scales:{y:{beginAtZero:true}}}
  });

  if(pieChart) pieChart.destroy();
  pieChart = new Chart(pieCtx,{
    type:"pie",
    data:{
      labels:["Ringan","Sederhana","Berat"],
      datasets:[{data:Object.values(total)}]
    }
  });
});

/* === GLOBAL FUNCTIONS === */
window.editKes = async (id,oldJenis)=>{
  const baru = prompt("Jenis baru:",oldJenis);
  if(baru) await updateDoc(doc(db,"kesDisiplin",id),{jenis:baru});
};

window.deleteKes = async id=>{
  if(confirm("Padam kes ini?"))
    await deleteDoc(doc(db,"kesDisiplin",id));
};
</script>

</body>
</html>
